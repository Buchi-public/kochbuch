Käse"},{"menge":1,"einheit":"Stk","name":"Zwiebel"},{"menge":100,"einheit":"g","name":"Schafskäse (optional)"},{"menge":1,"einheit":"TL","name":"Salz"},{"menge":0.5,"einheit":"TL","name":"Pfeffer"},{"menge":1,"einheit":"TL","name":"Paprikapulver edelsüß"},{"menge":15,"einheit":"g","name":"Butter für die Form"}],"schritte":[{"titel":"Erdäpfel kochen","text":"Erdäpfel in Salzwasser weich, aber noch fest kochen. Abgießen, etwas auskühlen lassen, schälen, in Scheiben schneiden.","timer_min":20},{"titel":"Vorheizen","text":"Rohr auf 180 °C Ober-/Unterhitze vorheizen, Form mit Butter ausstreichen."},{"titel":"Zwiebel","text":"Zwiebel fein hacken und goldgelb anschwitzen.","timer_min":5},{"titel":"Guss","text":"Topfen, Eier, Milch, Salz, Pfeffer und Paprikapulver glatt rühren, die Hälfte des Käses unterheben."},{"titel":"Schichten","text":"Erdäpfel und Zwiebel in die Form schichten, Guss darüber, optional Schafskäse darüberbröseln."},{"titel":"Überbacken","text":"Restlichen Käse darüberstreuen und goldbraun backen.","timer_min":30},{"titel":"Servieren","text":"Kurz rasten lassen, mit grünem Salat servieren."}],"tipps":["2–3 EL Tomatensoße im Guss machen ihn saftiger."],"varianten":["Frischer Paprika in Streifen statt Paprikapulver."],"passt_zu":["paprika-tomaten-suppe"]},{"id":"gefuellte-spitzpaprika","titel":"Gefüllte Spitzpaprika mit Reis & Schafskäse","kategorie":"Hauptgericht","tags":["vegetarisch","Rohr","Sommer"],"portionen":4,"portionen_einheit":"Portionen","gesamtzeit_min":60,"kurz":"Im Rohr in Paradeissauce geschmort – herzhaft und saftig.","zutaten":[{"menge":8,"einheit":"Stk","name":"Spitzpaprika (rot/gelb)"},{"menge":200,"einheit":"g","name":"Reis (Langkorn oder Risottoreis)"},{"menge":1,"einheit":"Stk","name":"Zwiebel, fein gehackt"},{"menge":2,"einheit":"Stk","name":"Knoblauchzehen, gehackt"},{"menge":200,"einheit":"g","name":"Schafskäse, zerbröselt"},{"menge":30,"einheit":"ml","name":"Olivenöl"},{"menge":1,"einheit":"TL","name":"Paprikapulver edelsüß"},{"menge":0.5,"einheit":"TL","name":"Kreuzkümmel (optional)"},{"menge":500,"einheit":"ml","name":"passierte Paradeiser"},{"menge":150,"einheit":"ml","name":"Gemüsesuppe"},{"menge":1,"einheit":"TL","name":"Salz"},{"menge":0.5,"einheit":"TL","name":"Pfeffer"},{"menge":2,"einheit":"EL","name":"Petersilie, gehackt"}],"schritte":[{"titel":"Reis vorkochen","text":"Reis in Salzwasser bissfest kochen, abseihen, auskühlen lassen.","timer_min":12},{"titel":"Fülle","text":"Zwiebel und Knoblauch in Olivenöl glasig anschwitzen, mit Paprikapulver und Kreuzkümmel würzen. Mit Reis, Schafskäse, Petersilie, Salz und Pfeffer vermengen."},{"titel":"Füllen","text":"Spitzpaprika oben einschneiden oder Deckel abschneiden, entkernen und befüllen."},{"titel":"Sauce","text":"Passierte Paradeiser mit Suppe verrühren, würzen, in eine Auflaufform gießen, Paprika hineinlegen."},{"titel":"Schmoren","text":"Zugedeckt bei 180 °C Ober-/Unterhitze schmoren, die letzten 10 Min. offen.","timer_min":35},{"titel":"Anrichten","text":"Mit Sauce anrichten, mit Petersilie bestreuen. Dazu Weißbrot oder Erdäpfelpüree."}],"tipps":["Lassen sich gut vorbereiten – aufgewärmt fast noch besser."],"varianten":["Couscous oder Hirse statt Reis.","50 g geröstete Pinienkerne oder Walnüsse in die Fülle.","Chiliflocken in die Sauce für mehr Schärfe."],"passt_zu":[]},{"id":"miso-karotten-pasta","titel":"Cremige Miso-Karotten-Pasta","kategorie":"Hauptgericht","tags":["vegetarisch","vegan","Rohr"],"portionen":4,"portionen_einheit":"Portionen","gesamtzeit_min":45,"kurz":"Ofenkarotten mit Zwiebel und Knoblauch, mit Miso zu einer samtigen Sauce gemixt – über Rigatoni.","zutaten":[{"menge":700,"einheit":"g","name":"Karotten, geschält, in Scheiben"},{"menge":1,"einheit":"Stk","name":"Zwiebel, grob geschnitten"},{"menge":1,"einheit":"Stk","name":"Knoblauchknolle"},{"menge":30,"einheit":"ml","name":"Olivenöl"},{"menge":0.5,"einheit":"TL","name":"Salz"},{"menge":0.25,"einheit":"TL","name":"Pfeffer"},{"menge":2,"einheit":"EL","name":"Miso (hell) – Ersatz siehe Tipps"},{"menge":2,"einheit":"EL","name":"Hefeflocken (optional) – Ersatz siehe Tipps"},{"menge":300,"einheit":"ml","name":"Gemüsesuppe"},{"menge":150,"einheit":"g","name":"Seidentofu – Ersatz siehe Tipps"},{"menge":400,"einheit":"g","name":"Rigatoni"},{"menge":2,"einheit":"EL","name":"Petersilie, gehackt"},{"menge":0.5,"einheit":"TL","name":"Chiliflocken"}],"schritte":[{"titel":"Vorheizen","text":"Rohr auf 220 °C Ober-/Unterhitze (200 °C Umluft) vorheizen."},{"titel":"Gemüse aufs Blech","text":"Karotten und Zwiebel auf einem Blech verteilen, mit der Hälfte des Olivenöls beträufeln, salzen und pfeffern. Die ganze Knoblauchknolle ungeschält quer durchschneiden (alle Zehen werden in der Mitte aufgeschnitten), mit der Schnittfläche nach oben dazulegen und mit dem restlichen Öl beträufeln."},{"titel":"Rösten","text":"Rösten, bis die Karotten weich und leicht gebräunt sind; nach der Hälfte der Zeit wenden.","timer_min":30},{"titel":"Pasta kochen","text":"Währenddessen die Rigatoni in Salzwasser bissfest kochen. Vor dem Abgießen eine Tasse Kochwasser aufheben."},{"titel":"Mixen","text":"Die gerösteten Knoblauchhälften über dem Mixer wie eine Tube ausdrücken – das weiche Fruchtfleisch kommt heraus, die Schalen wegwerfen. Ofengemüse, Miso, Hefeflocken, Gemüsesuppe und Seidentofu dazugeben und alles fein und cremig mixen, mit Salz und Pfeffer abschmecken."},{"titel":"Vermengen","text":"Sauce mit der Pasta im Topf erwärmen und vermengen, bei Bedarf mit etwas Kochwasser verdünnen. Mit Petersilie und Chiliflocken servieren."}],"tipps":["Ersatz für Miso: 1 EL Sojasauce (oder Tamari) + 1 TL Tahini oder Cashewmus; alternativ 1 TL Gemüsebrühpulver + 1 TL Tomatenmark. Dann vorsichtig salzen – Sojasauce ist salzig.","Ersatz für Hefeflocken: einfach weglassen oder ½ TL Senf + Spritzer Zitronensaft; nicht vegan: 30 g geriebener Parmesan.","Ersatz für Seidentofu: 100 ml Schlagobers oder 2–3 EL Frischkäse (dann nicht vegan); vegan: 50 g eingeweichte Cashews; oder ganz weglassen und etwas mehr Suppe nehmen.","Miso erst im Mixer zugeben – nicht mitrösten, so bleibt das Aroma erhalten.","Sauce lässt sich vorbereiten und hält im Kühlschrank 2–3 Tage; beim Erwärmen mit etwas Wasser glatt rühren."],"varianten":["Würziger: 1 EL Tomatenmark, 1 TL Paprikapulver und einige getrocknete Tomaten mitmixen.","Nicht-vegan: Parmesan darüberreiben."],"passt_zu":[]},{"id":"tomaten-quinoa-pfanne","titel":"Tomaten-Quinoa-Pfanne mit Bohnen, Mais & Parmesan","kategorie":"Hauptgericht","tags":["vegetarisch","schnell","Vorrat"],"portionen":4,"portionen_einheit":"Portionen","gesamtzeit_min":30,"kurz":"Quinoa direkt in Tomatensauce gegart, mit weißen Bohnen, Mais, Parmesan und Petersilie – alles in einer Pfanne.","zutaten":[{"menge":200,"einheit":"g","name":"Quinoa"},{"menge":30,"einheit":"ml","name":"Olivenöl"},{"menge":1,"einheit":"Stk","name":"Zwiebel, fein gewürfelt"},{"menge":2,"einheit":"Stk","name":"Knoblauchzehen, gehackt"},{"menge":1,"einheit":"EL","name":"Tomatenmark"},{"menge":1,"einheit":"TL","name":"Paprikapulver edelsüß"},{"menge":0.5,"einheit":"TL","name":"Oregano, getrocknet"},{"menge":400,"einheit":"g","name":"gehackte Tomaten (Dose)"},{"menge":350,"einheit":"ml","name":"Gemüsesuppe"},{"menge":240,"einheit":"g","name":"weiße Bohnen, abgetropft (1 Dose)"},{"menge":285,"einheit":"g","name":"Mais, abgetropft (1 Dose)"},{"menge":50,"einheit":"g","name":"Parmesan, frisch gerieben"},{"menge":0.5,"einheit":"TL","name":"Salz"},{"menge":0.25,"einheit":"TL","name":"Pfeffer"},{"menge":2,"einheit":"EL","name":"Petersilie, gehackt"}],"schritte":[{"titel":"Quinoa spülen","text":"Quinoa im feinen Sieb gründlich mit heißem Wasser spülen – nimmt die Bitterstoffe."},{"titel":"Anschwitzen","text":"Olivenöl in einer großen Pfanne (mit Deckel) erhitzen, Zwiebel glasig anschwitzen, Knoblauch kurz mitrösten.","timer_min":4},{"titel":"Würzen","text":"Tomatenmark, Paprikapulver und Oregano einrühren und kurz mitrösten. Quinoa zugeben und unter Rühren 1 Minute anrösten.","timer_min":1},{"titel":"Garen","text":"Gehackte Tomaten und Gemüsesuppe zugießen, salzen, aufkochen. Zugedeckt bei kleiner Hitze garen, bis die Quinoa weich ist und die Flüssigkeit fast aufgenommen hat; gelegentlich umrühren.","timer_min":15},{"titel":"Bohnen & Mais","text":"Bohnen und Mais unterheben und offen ein paar Minuten mitziehen lassen, bis alles heiß und eher trocken-locker ist.","timer_min":4},{"titel":"Fertigstellen","text":"Vom Herd nehmen, Parmesan unterrühren, mit Salz und Pfeffer abschmecken. Mit Petersilie und extra Parmesan servieren – dazu grüner Salat."}],"tipps":["Wird es zu trocken, einen Schuss Suppe nachgießen; ist es noch zu flüssig, offen kurz weiter einkochen.","Schmeckt auch kalt als Salat oder aufgewärmt am nächsten Tag."],"varianten":["Vegan: Parmesan weglassen, 2 EL Hefeflocken einrühren.","Mexikanisch: Kidneybohnen statt weißer Bohnen, ½ TL Kreuzkümmel und etwas Chili, Limettensaft zum Schluss.","Mehr Gemüse: 1 gewürfelte Paprika oder Zucchini mit der Zwiebel anbraten."],"passt_zu":[]},{"id":"reis-grundrezept","titel":"Reis kochen – Grundrezept (Quell- & Absiebmethode)","kategorie":"Salat & Beilage","tags":["vegan","Grundrezept","große Runde"],"portionen":12,"portionen_einheit":"Portionen","gesamtzeit_min":30,"kurz":"Gelingsicher für 1 kg Basmati (ca. 85 g roh pro Person als Beilage zu gehaltvollen Gerichten).","zutaten":[{"menge":1000,"einheit":"g","name":"Basmatireis"},{"menge":1500,"einheit":"ml","name":"Wasser, kalt (Quellmethode)"},{"menge":2,"einheit":"TL","name":"Salz"},{"menge":15,"einheit":"ml","name":"Öl (optional)"}],"schritte":[{"titel":"Spülen","text":"Reis im Sieb unter kaltem Wasser spülen, bis es klar abläuft – wird lockerer."},{"titel":"Aufkochen","text":"In einen Topf (mind. 5 l) geben, Wasser, Salz und optional Öl dazu, ohne Deckel aufkochen, einmal umrühren."},{"titel":"Quellen","text":"Deckel drauf, kleinste Stufe – Deckel nicht heben.","timer_min":12},{"titel":"Ziehen lassen","text":"Herd aus, zugedeckt ziehen lassen, dann mit der Gabel auflockern.","timer_min":10}],"tipps":["Absiebmethode (verzeiht mehr, kann nicht anbrennen): reichlich Salzwasser (mind. 4 l, 1 EL Salz) aufkochen, Reis 10–12 Min. sprudelnd kochen, abseihen, zurück in den Topf, 5 Min. zugedeckt nachdämpfen.","Im Rohr: Reis, Wasser und Salz im Bräter abgedeckt bei 180 °C ca. 25 Min.","Hält zugedeckt ca. 30 Min. warm.","Dampfgarer (ungelochter Behälter, 100 °C), Reis : Wasser nach Volumen: Langkorn/Jasmin 1 : 1,5 (20–25 Min.), Basmati 1 : 1,25–1,5 (20–25 Min.), Parboiled 1 : 1,5 (25–30 Min.), Vollkorn 1 : 1,5–2 (30–35 Min.). 1 Becher Reis ≈ 3 Beilagen-Portionen."],"varianten":[],"passt_zu":["chili-sin-carne-12"]},{"id":"rote-rueben-salat","titel":"Steirischer Rote-Rüben-Salat mit Kren","kategorie":"Salat & Beilage","tags":["vegetarisch","vegan","steirisch","schnell"],"portionen":4,"portionen_einheit":"Portionen","gesamtzeit_min":40,"kurz":"Klassisch mit Kren, Kümmel und Kürbiskernöl – aus vorgegarten Rüben in 10 Minuten (plus Ziehzeit).","zutaten":[{"menge":500,"einheit":"g","name":"Rote Rüben, gekocht & geschält"},{"menge":1,"einheit":"Stk","name":"kleine rote Zwiebel, feine Ringe"},{"menge":45,"einheit":"ml","name":"Apfelessig"},{"menge":30,"einheit":"ml","name":"Kürbiskernöl"},{"menge":2,"einheit":"TL","name":"Kren, frisch gerissen"},{"menge":1,"einheit":"TL","name":"Kümmel, ganz"},{"menge":0.5,"einheit":"TL","name":"Salz"},{"menge":1,"einheit":"TL","name":"Zucker"},{"menge":0.25,"einheit":"TL","name":"schwarzer Pfeffer"}],"schritte":[{"titel":"Schneiden","text":"Rüben abtropfen lassen, in dünne Scheiben oder Spalten schneiden (Brett vorher leicht einölen, färbt weniger)."},{"titel":"Marinade","text":"Essig, Kürbiskernöl, Salz, Zucker und Pfeffer verrühren. Kümmel in einer trockenen Pfanne kurz anrösten und dazugeben."},{"titel":"Anmachen","text":"Rüben mit Zwiebel und Marinade vermengen, Kren zum Schluss unterheben."},{"titel":"Ziehen lassen","text":"Zugedeckt durchziehen lassen, gern über Nacht im Kühlschrank. Vor dem Servieren abschmecken.","timer_min":30}],"tipps":["Kren erst zum Schluss – sonst verliert er die Schärfe.","Vakuum-Rüben vor Gebrauch prüfen: Packung nicht aufgebläht, Lake klar, Geruch sauber-erdig."],"varianten":["1 säuerlichen Apfel klein gewürfelt untermischen.","Passt zu Backhendl, Schweinsbraten oder Erdäpfeln mit Sauerrahm."],"passt_zu":["rote-rueben-cremesuppe","warmes-rote-rueben-gemuese"]},{"id":"warmes-rote-rueben-gemuese","titel":"Warmes Rote-Rüben-Gemüse mit Kren","kategorie":"Salat & Beilage","tags":["vegetarisch","schnell"],"portionen":4,"portionen_einheit":"Portionen","gesamtzeit_min":15,"kurz":"Cremige Beilage mit Kümmel, Schlagobers und Kren.","zutaten":[{"menge":500,"einheit":"g","name":"Rote Rüben, gekocht & geschält"},{"menge":1,"einheit":"Stk","name":"Zwiebel, fein gewürfelt"},{"menge":30,"einheit":"g","name":"Butter"},{"menge":1,"einheit":"TL","name":"Kümmel, ganz"},{"menge":125,"einheit":"ml","name":"Schlagobers"},{"menge":2,"einheit":"TL","name":"Kren, frisch gerissen"},{"menge":15,"einheit":"ml","name":"Apfelessig"},{"menge":0.5,"einheit":"TL","name":"Salz"},{"menge":0.25,"einheit":"TL","name":"schwarzer Pfeffer"},{"menge":1,"einheit":"TL","name":"Zucker"}],"schritte":[{"titel":"Schneiden","text":"Rüben abtropfen lassen, in Scheiben oder Würfel schneiden."},{"titel":"Anschwitzen","text":"Butter schmelzen, Zwiebel und Kümmel bei mittlerer Hitze glasig anschwitzen – nicht bräunen.","timer_min":4},{"titel":"Dünsten","text":"Rüben kurz mitschwenken, mit Essig ablöschen, Schlagobers angießen und offen einkochen, bis die Sauce leicht bindet.","timer_min":7},{"titel":"Abschmecken","text":"Mit Salz, Pfeffer und Zucker abschmecken. Vom Herd nehmen, Kren erst jetzt unterheben, sofort servieren."}],"tipps":["Kren nie mitkochen – wird bitter.","Rüben sind schon gar – nur heiß werden lassen, nicht zerkochen."],"varianten":["Sämiger: 1 TL Mehl mit der Zwiebel anschwitzen.","Ohne Obers: in Butter mit Kümmel schwenken, mit Essig und Schuss Apfelsaft ablöschen.","Passt zu Wild, Schweinsbraten oder Erdäpfeln mit Spiegelei."],"passt_zu":["rote-rueben-salat","rote-rueben-cremesuppe"]},{"id":"dinkel-kirschkuchen","titel":"Dinkel-Kirschkuchen mit Dattelzucker","kategorie":"Kuchen & Gebäck","tags":["vegetarisch","Sommer","ohne Weißzucker"],"portionen":12,"portionen_einheit":"Stück","gesamtzeit_min":75,"kurz":"Rührkuchen in der 26-cm-Springform, mit reduzierter Süße.","zutaten":[{"menge":500,"einheit":"g","name":"entkernte Kirschen (frisch oder TK, gut abgetropft)"},{"menge":250,"einheit":"g","name":"Dinkelmehl (Type 630)"},{"menge":120,"einheit":"g","name":"Dattelzucker"},{"menge":150,"einheit":"g","name":"weiche Butter"},{"menge":3,"einheit":"Stk","name":"Eier (M)"},{"menge":15,"einheit":"g","name":"Backpulver (1 Pkg. = 15 g)"},{"menge":1,"einheit":"Prise","name":"Salz"},{"menge":1,"einheit":"TL","name":"Vanille oder abgeriebene Zitronenschale"},{"menge":30,"einheit":"ml","name":"Milch (nach Bedarf, 30–45 ml)"},{"menge":null,"einheit":"","name":"Mandelblättchen zum Bestreuen (optional)"}],"schritte":[{"titel":"Vorbereiten","text":"Rohr auf 180 °C Ober-/Unterhitze vorheizen. Springform (26 cm) fetten oder mit Backpapier auslegen."},{"titel":"Kirschen","text":"Kirschen gut abtropfen lassen und in 1 EL Mehl wälzen – so sinken sie nicht ab."},{"titel":"Aufschlagen","text":"Butter mit Dattelzucker und Salz mehrere Minuten cremig aufschlagen (Dattelzucker löst sich schlechter – ruhig länger)."},{"titel":"Eier","text":"Eier einzeln unterrühren, Vanille bzw. Zitronenschale zugeben."},{"titel":"Mehl","text":"Mehl mit Backpulver mischen und unterheben. Ist der Teig sehr fest, Milch ergänzen, bis er weich vom Löffel fällt."},{"titel":"Belegen","text":"Teig in die Form streichen, Kirschen verteilen, leicht eindrücken, nach Wunsch Mandelblättchen darüber."},{"titel":"Backen","text":"Backen, Stäbchenprobe (45–55 Min.). Bräunt er zu schnell, nach ca. 25 Min. abdecken.","timer_min":50},{"titel":"Auskühlen","text":"Auskühlen lassen, aus der Form lösen."}],"tipps":["Dattelzucker süßt milder, leicht karamellig – wer es süßer mag, 1–2 EL mehr."],"varianten":["Mit ungesüßtem Joghurt servieren."],"passt_zu":[]},{"id":"kanelsnegle","titel":"Kanelsnegle – dänische Zimtschnecken mit Vanillecreme","kategorie":"Kuchen & Gebäck","tags":["vegetarisch","Germteig","Dänemark"],"portionen":12,"portionen_einheit":"Stück","gesamtzeit_min":150,"kurz":"Germteig mit Zimt-Remonce, nach dem Backen mit Butter übergossen, dazu warme gießbare Vanillecreme.","zutaten":[{"menge":250,"einheit":"ml","name":"Milch, lauwarm","gruppe":"Teig"},{"menge":25,"einheit":"g","name":"frische Germ","gruppe":"Teig"},{"menge":500,"einheit":"g","name":"Weizenmehl (Type 700)","gruppe":"Teig"},{"menge":80,"einheit":"g","name":"Zucker","gruppe":"Teig"},{"menge":1,"einheit":"Stk","name":"Ei (M)","gruppe":"Teig"},{"menge":100,"einheit":"g","name":"Butter, weich","gruppe":"Teig"},{"menge":0.5,"einheit":"TL","name":"Salz","gruppe":"Teig"},{"menge":1,"einheit":"TL","name":"Kardamom, gemahlen","gruppe":"Teig"},{"menge":120,"einheit":"g","name":"Butter, weich","gruppe":"Remonce (Füllung)"},{"menge":120,"einheit":"g","name":"brauner Zucker","gruppe":"Remonce (Füllung)"},{"menge":2,"einheit":"EL","name":"Zimt","gruppe":"Remonce (Füllung)"},{"menge":1,"einheit":"Prise","name":"Salz","gruppe":"Remonce (Füllung)"},{"menge":50,"einheit":"g","name":"Butter, geschmolzen","gruppe":"Zum Übergießen"},{"menge":400,"einheit":"ml","name":"Milch","gruppe":"Vanillecreme"},{"menge":100,"einheit":"ml","name":"Schlagobers","gruppe":"Vanillecreme"},{"menge":4,"einheit":"Stk","name":"Eidotter","gruppe":"Vanillecreme"},{"menge":60,"einheit":"g","name":"Zucker","gruppe":"Vanillecreme"},{"menge":15,"einheit":"g","name":"Maisstärke","gruppe":"Vanillecreme"},{"menge":1,"einheit":"Stk","name":"Vanilleschote","gruppe":"Vanillecreme"}],"schritte":[{"titel":"Germ ansetzen","text":"Germ in der lauwarmen Milch auflösen, 1 TL vom Zucker dazu, stehen lassen, bis es schäumt.","timer_min":10},{"titel":"Teig kneten","text":"Mehl, Zucker, Ei, Salz und Kardamom mit der Germmilch verkneten. Nach 3 Min. die Butter stückweise einarbeiten, weitere 8–10 Min. kneten, bis der Teig glatt, weich und leicht klebrig ist."},{"titel":"Gehen lassen","text":"Abgedeckt an einem warmen Ort gehen lassen, bis er sich verdoppelt hat.","timer_min":60},{"titel":"Remonce","text":"Butter, braunen Zucker, Zimt und Salz streichfähig verrühren."},{"titel":"Formen","text":"Teig auf bemehlter Fläche ca. 40 × 50 cm ausrollen, Remonce bis zum Rand aufstreichen, von der langen Seite aufrollen, in 12 Stücke schneiden. In eine gebutterte Form (ca. 25 × 35 cm) mit etwas Abstand setzen."},{"titel":"Nochmals gehen lassen","text":"Abgedeckt gehen lassen, bis sich die Schnecken berühren. Rohr auf 190 °C Ober-/Unterhitze vorheizen.","timer_min":30},{"titel":"Backen","text":"Mittlere Schiene, goldbraun backen.","timer_min":18},{"titel":"Vanillecreme","text":"Währenddessen Dotter, Zucker, Stärke und Vanillemark glatt rühren. Milch und Obers mit der Schote aufkochen, Schote entfernen, heiß unter Rühren zur Dottermasse gießen, zurück in den Topf und bei kleiner Hitze rühren, bis die Creme gerade andickt – nicht kochen. Dickflüssig, aber gießbar.","timer_min":5},{"titel":"Servieren","text":"Schnecken sofort aus dem Rohr nehmen, heiß mit der geschmolzenen Butter übergießen, kurz rasten lassen und warm mit Vanillecreme servieren."}],"tipps":["Teig klebt und zieht sich zurück – normal. Kein Mehl nachgeben, lieber Hände einölen oder Teigkarte nehmen.","Fenstertest: Teigstück dünn ausziehen – bildet es ein durchscheinendes Fenster ohne zu reißen, ist er fertig geknetet.","Butter gleich am Anfang eingeknetet geht auch, braucht nur länger Kneten.","Zweites Gehen: max. 30–35 °C bzw. nur Backofenlicht, nicht 40 °C. Fingerdrucktest statt auf Verdopplung warten.","Nach Backende sofort herausholen – im heißen Rohr werden sie trocken. Sind sie blass, lieber 2–3 Min. verlängern.","Creme geht nicht in den Ofen. Am besten während der 18 Min. Backzeit kochen. Dotter sind bei 80–85 °C gegart.","Creme vorbereiten: Frischhaltefolie direkt auf die Oberfläche, kühlen, bei kleiner Hitze mit Schuss Milch wieder gießbar machen. Hält 2 Tage."],"varianten":["Halbe Creme-Menge: 200 ml Milch, 50 ml Obers, 2 Dotter, 30 g Zucker, 8 g Stärke, ½ Vanilleschote.","Creme in der Füllung (kanelsnegle med kagecreme): mit 25 g Stärke dicker kochen, auskühlen, dünn unter die Remonce streichen.","Trockengerm: 7 g (1 Pkg.) statt 25 g frischer Germ."],"passt_zu":[]},{"id":"rhabarber-blechkuchen","titel":"Rhabarber-Blechkuchen mit Dinkelmehl & Dattelzucker","kategorie":"Kuchen & Gebäck","tags":["vegetarisch","Frühling","ohne Weißzucker"],"portionen":12,"portionen_einheit":"Stück","gesamtzeit_min":60,"kurz":"Saftiger Rührteig vom Blech mit 500 g Bio-Rhabarber.","zutaten":[{"menge":500,"einheit":"g","name":"Bio-Rhabarber"},{"menge":300,"einheit":"g","name":"Dinkelmehl (Type 700)"},{"menge":180,"einheit":"g","name":"Dattelzucker"},{"menge":1,"einheit":"EL","name":"Backpulver (ca. 10 g)"},{"menge":1,"einheit":"Prise","name":"Salz"},{"menge":200,"einheit":"g","name":"weiche Butter"},{"menge":4,"einheit":"Stk","name":"Eier (M)"},{"menge":120,"einheit":"ml","name":"Milch"},{"menge":1,"einheit":"TL","name":"Vanillezucker oder gemahlene Vanille"},{"menge":2,"einheit":"EL","name":"Dattelzucker zum Bestreuen"}],"schritte":[{"titel":"Vorbereiten","text":"Rohr auf 180 °C Ober-/Unterhitze vorheizen, Blech (ca. 30 × 40 cm) mit Backpapier auslegen."},{"titel":"Rhabarber putzen","text":"Rhabarber waschen, Enden abschneiden, bei Bedarf grob abziehen, in 1–2 cm Stücke schneiden."},{"titel":"Teig","text":"Butter, Dattelzucker und Vanille schaumig schlagen, Eier einzeln einrühren. Mehl, Backpulver und Salz mischen und abwechselnd mit der Milch kurz unterrühren – nicht zu lange."},{"titel":"Aufs Blech","text":"Teig glatt streichen, Rhabarber verteilen, leicht andrücken, mit Dattelzucker bestreuen."},{"titel":"Backen","text":"Mittlere Schiene, goldbraun backen, Stäbchenprobe.","timer_min":35},{"titel":"Auskühlen","text":"Auf dem Blech auskühlen lassen, dann schneiden."}],"tipps":["Dattelzucker karamellisiert stärker – bei dunkler Oberfläche nach ca. 25 Min. mit Backpapier abdecken.","Dinkel bindet mehr Flüssigkeit als Weizen, daher 120 ml Milch."],"varianten":["Mit Topfen- oder Joghurtguss extra saftig.","Mit glattem Weizenmehl: 100 ml Milch."],"passt_zu":[]},{"id":"karotten-cupcakes","titel":"Karotten-Cupcakes mit Frischkäse-Frosting","kategorie":"Kuchen & Gebäck","tags":["vegetarisch","ohne Weißzucker"],"portionen":12,"portionen_einheit":"Stück","gesamtzeit_min":50,"kurz":"Saftige Karotten-Muffins mit Zimt, Ingwer und Orange, gesüßt mit Ahornsirup – mit leichtem Frischkäse-Joghurt-Frosting.","zutaten":[{"menge":200,"einheit":"g","name":"Karotten","gruppe":"Teig"},{"menge":2,"einheit":"Stk","name":"Eier","gruppe":"Teig"},{"menge":70,"einheit":"ml","name":"Ahornsirup oder Honig","gruppe":"Teig"},{"menge":60,"einheit":"ml","name":"Rapsöl","gruppe":"Teig"},{"menge":150,"einheit":"g","name":"Weizenmehl","gruppe":"Teig"},{"menge":1,"einheit":"TL","name":"Backpulver","gruppe":"Teig"},{"menge":1,"einheit":"TL","name":"Zimt","gruppe":"Teig"},{"menge":0.5,"einheit":"TL","name":"Ingwer, gemahlen","gruppe":"Teig"},{"menge":1,"einheit":"Stk","name":"Orange (Bio, nur Abrieb)","gruppe":"Teig"},{"menge":1,"einheit":"Prise","name":"Salz","gruppe":"Teig"},{"menge":40,"einheit":"g","name":"Walnüsse oder Pecannüsse, gehackt","gruppe":"Teig"},{"menge":150,"einheit":"g","name":"Frischkäse","gruppe":"Frosting"},{"menge":120,"einheit":"g","name":"griechisches Joghurt","gruppe":"Frosting"},{"menge":30,"einheit":"ml","name":"Ahornsirup oder Honig","gruppe":"Frosting"},{"menge":5,"einheit":"ml","name":"Zitronensaft","gruppe":"Frosting"},{"menge":null,"einheit":"","name":"etwas Orangenabrieb","gruppe":"Frosting"}],"schritte":[{"titel":"Vorbereiten","text":"Rohr auf 180 °C Ober-/Unterhitze vorheizen, Muffinblech mit Papierförmchen auslegen."},{"titel":"Karotten reiben","text":"Karotten fein reiben."},{"titel":"Eiermasse","text":"Eier mit Ahornsirup bzw. Honig cremig aufschlagen, Öl und Orangenabrieb einrühren."},{"titel":"Trockene Zutaten","text":"Mehl, Backpulver, Zimt, Ingwer und Salz vermischen und unter die Eiermasse heben."},{"titel":"Karotten & Nüsse","text":"Geriebene Karotten und Nüsse unterheben."},{"titel":"Backen","text":"Teig auf die Förmchen verteilen und backen (20–25 Min., Stäbchenprobe). Danach vollständig auskühlen lassen.","timer_min":22},{"titel":"Frosting","text":"Frischkäse, Joghurt, Ahornsirup und Zitronensaft glatt rühren, Orangenabrieb dazu. Auf die ausgekühlten Cupcakes streichen und mit Nüssen dekorieren."}],"tipps":["Frosting erst auf die vollständig ausgekühlten Cupcakes – sonst rinnt es.","Für die Deko ein paar gehackte Nüsse beiseitelegen.","Mit Frosting im Kühlschrank aufbewahren."],"varianten":["Dinkelmehl (Type 700) statt Weizenmehl.","Ohne Frosting als einfache Karotten-Muffins."],"passt_zu":[]},{"id":"bratapfel","titel":"Bratäpfel mit Nuss-Marzipan-Fülle","kategorie":"Dessert","tags":["vegetarisch","Herbst/Winter","Rohr"],"portionen":4,"portionen_einheit":"Stück","gesamtzeit_min":50,"kurz":"Säuerliche Äpfel mit Nüssen, Rosinen und Marzipan, dazu Vanillesauce.","zutaten":[{"menge":4,"einheit":"Stk","name":"große säuerliche Äpfel (z. B. Boskoop, Elstar)"},{"menge":60,"einheit":"g","name":"gehackte Haselnüsse oder Walnüsse"},{"menge":40,"einheit":"g","name":"Rosinen"},{"menge":60,"einheit":"g","name":"Marzipanrohmasse"},{"menge":30,"einheit":"g","name":"Butter, weich"},{"menge":40,"einheit":"g","name":"Honig"},{"menge":1,"einheit":"TL","name":"Zimt"},{"menge":30,"einheit":"ml","name":"Rum oder Apfelsaft"},{"menge":100,"einheit":"ml","name":"Apfelsaft zum Angießen"},{"menge":200,"einheit":"ml","name":"Vanillesauce oder Vanilleeis zum Servieren"}],"schritte":[{"titel":"Rosinen einweichen","text":"Rosinen in Rum bzw. Apfelsaft einweichen. Rohr auf 180 °C Ober-/Unterhitze vorheizen.","timer_min":10},{"titel":"Äpfel vorbereiten","text":"Äpfel waschen, Deckel abschneiden, Kerngehäuse entfernen – Boden bleibt geschlossen. Höhlung etwas erweitern."},{"titel":"Fülle","text":"Marzipan fein würfeln, mit Nüssen, Rosinen, Butter, Honig und Zimt verkneten."},{"titel":"Füllen","text":"Fülle fest in die Äpfel drücken, Deckel aufsetzen, in eine ofenfeste Form stellen, Apfelsaft angießen."},{"titel":"Backen","text":"Backen, bis die Äpfel weich sind und die Haut leicht aufplatzt, zwischendurch mit Saft beträufeln.","timer_min":30},{"titel":"Servieren","text":"Warm mit Vanillesauce und dem Saft aus der Form servieren."}],"tipps":["Boskoop bleibt in Form, weiche Sorten (Golden Delicious) zerfallen.","Zu fest? 5–10 Min. länger backen.","Neff-Dampfbackofen: CircoTherm + Dampf, mittlere Intensität, 160–170 °C, 25–35 Min. – bleiben saftiger. Normaler Ofen: CircoTherm 180 °C, 25–35 Min."],"varianten":["Ohne Marzipan: 1 EL braunen Zucker verwenden.","Für Kinder: Apfelsaft statt Rum."],"passt_zu":[]},{"id":"milchreis-dampfgarer","titel":"Milchreis im Dampfbackofen","kategorie":"Dessert","tags":["vegetarisch","Dampfgarer"],"portionen":4,"portionen_einheit":"Portionen","gesamtzeit_min":45,"kurz":"Cremig, ohne Anbrennen – Dampfgaren bei 100 °C im ungelochten Dampfbehälter.","zutaten":[{"menge":200,"einheit":"g","name":"Milchreis (Rundkornreis)"},{"menge":500,"einheit":"ml","name":"Vollmilch"},{"menge":40,"einheit":"g","name":"Zucker"},{"menge":8,"einheit":"g","name":"Vanillezucker"},{"menge":1,"einheit":"Prise","name":"Salz"},{"menge":10,"einheit":"g","name":"Butter"},{"menge":2,"einheit":"TL","name":"Zimt-Zucker zum Bestreuen"}],"schritte":[{"titel":"Ansetzen","text":"Reis, Milch, Zucker, Vanillezucker und Salz im ungelochten Dampfbehälter verrühren – Flüssigkeit soll den Reis gut bedecken."},{"titel":"Dampfgaren","text":"Wassertank füllen, Behälter auf mittlere Höhe, Dampfgaren 100 °C.","timer_min":20},{"titel":"Umrühren","text":"Einmal kräftig umrühren. Ist er schon sehr dick, Schuss Milch nachgeben."},{"titel":"Fertig garen","text":"Weiter dämpfen bei 100 °C, bis der Reis weich und cremig ist.","timer_min":20},{"titel":"Verfeinern","text":"Butter unterrühren, quellen lassen, mit Zimt-Zucker bestreut servieren.","timer_min":5}],"tipps":["Reis : Milch nach Volumen im Dampfgarer: 1 : 2 stichfest, 1 : 2,5 cremig (Standard), 1 : 3 sehr cremig. Im Topf 1 : 4, weil dort Milch verdampft.","Kein gelochter Behälter, kein Deckel. Alternativ Auflaufform/ofenfester Topf offen auf dem Rost (+ ca. 5 Min.).","Langkornreis wird nicht cremig – Ersatz: Risottoreis (Arborio, Carnaroli)."],"varianten":["Cremiger: 50 ml Milch durch Schlagobers ersetzen.","Dazu Kompott, Zwetschkenröster oder heiße Kirschen."],"passt_zu":[]}]};</script>
